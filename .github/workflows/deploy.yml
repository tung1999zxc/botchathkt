name: Deploy Worker (manual)

# CHAY THU CONG: Actions > Deploy Worker > Run workflow
#
# Cach deploy chinh la CLOUDFLARE WORKERS BUILDS (git integration)
# da duoc gan san trong Cloudflare Dashboard - tu dong deploy moi khi push.
# File nay la phuong an DU PHONG, dung khi Workers Builds gap loi.
#
# - Cloudflare Dashboard > Workers & Pages > license-kv > Settings > Builds
#   -> xem trang thai build moi nhat

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Bien mat khau Cloudflare -> GitHub > Settings > Secrets and variables > Actions
      # - CLOUDFLARE_API_TOKEN : Cloudflare API Token (Workers Scripts: Edit)
      # - CLOUDFLARE_ACCOUNT_ID : Account ID
      #
      # Cach tao API Token:
      #   Cloudflare Dashboard > My Profile > API Tokens > Create Token
      #   > Edit Cloudflare Workers template
      #   > Account Resources: chon Account cua ban
      #   > Client IP Address: giu trong (0.0.0.0/0)
      #
      # Cach lay Account ID:
      #   Cloudflare Dashboard > Workers & Pages > license-kv > Settings > Account ID
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
